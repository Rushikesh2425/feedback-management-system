<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feedback Management</title>
  <style>
    body { max-width: 700px; margin: 40px auto; font-family: Arial, sans-serif; }
    input, textarea, button { box-sizing: border-box; width: 100%; padding: 10px; margin: 6px 0; }
    textarea { height: 100px; }
    button { background: #1677ff; color: white; border: 0; cursor: pointer; }
    .feedback { border: 1px solid #ddd; border-radius: 6px; padding: 12px; margin: 10px 0; }
  </style>
</head>
<body>
  <h1>Feedback Management</h1>
  <form method="post">
    <input name="name" placeholder="Your name" required>
    <textarea name="message" placeholder="Your feedback" required></textarea>
    <button type="submit">Submit Feedback</button>
  </form>

  <h2>All Feedback</h2>
  {% for item in feedback %}
    <div class="feedback">
      <strong>{{ item.name }}</strong>
      <p>{{ item.message }}</p>
    </div>
  {% else %}
    <p>No feedback yet.</p>
  {% endfor %}
</body>
</html>
